<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productive Laziness AI</title>
    <!-- Marked.js to parse Markdown tables, headers, and code -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }
        body {
            background-color: #0b1120;
            color: #f1f5f9;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        header {
            padding: 16px 24px;
            background-color: #0f172a;
            border-bottom: 1px solid #1e293b;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        header h1 {
            font-size: 1.25rem;
            color: #38bdf8;
            font-weight: 700;
        }
        header .badge {
            font-size: 0.8rem;
            color: #94a3b8;
        }
        #chat-window {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .message-bubble {
            max-width: 85%;
            padding: 16px 20px;
            border-radius: 12px;
            line-height: 1.6;
            font-size: 0.95rem;
            word-wrap: break-word;
        }
        .user-message {
            background-color: #0284c7;
            align-self: flex-end;
            color: #ffffff;
            border-bottom-right-radius: 2px;
        }
        .bot-message {
            background-color: #1e293b;
            align-self: flex-start;
            color: #e2e8f0;
            border-bottom-left-radius: 2px;
            border: 1px solid #334155;
        }
        .bot-message h3 {
            color: #38bdf8;
            margin: 14px 0 6px 0;
            font-size: 1.05rem;
        }
        .bot-message ul {
            margin-left: 20px;
            margin-bottom: 10px;
        }
        /* Markdown Table Card Styles */
        .bot-message table {
            width: 100%;
            border-collapse: collapse;
            margin: 14px 0;
            font-size: 0.9rem;
            background-color: #0f172a;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #334155;
        }
        .bot-message th, .bot-message td {
            border: 1px solid #334155;
            padding: 10px 14px;
            text-align: left;
        }
        .bot-message th {
            background-color: #1e293b;
            color: #38bdf8;
            font-weight: 600;
        }
        .bot-message tr:nth-child(even) {
            background-color: #162032;
        }
        .bot-message a {
            color: #38bdf8;
            text-decoration: underline;
        }
        .bot-message pre {
            background-color: #0f172a;
            padding: 12px;
            border-radius: 8px;
            overflow-x: auto;
            border: 1px solid #334155;
            margin: 10px 0;
        }
        .bot-message code {
            font-family: Consolas, monospace;
            background: #0f172a;
            padding: 2px 4px;
            border-radius: 4px;
        }
        .input-bar {
            display: flex;
            gap: 12px;
            padding: 16px 24px;
            background-color: #0f172a;
            border-top: 1px solid #1e293b;
        }
        #prompt-input {
            flex: 1;
            padding: 12px 16px;
            background-color: #0b1120;
            border: 1px solid #334155;
            color: #f1f5f9;
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
        }
        #prompt-input:focus {
            border-color: #38bdf8;
        }
        #send-btn {
            background-color: #0284c7;
            color: #ffffff;
            border: none;
            padding: 0 24px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        #send-btn:hover {
            background-color: #0369a1;
        }
    </style>
</head>
<body>
    <header>
        <h1>Productive Laziness AI</h1>
        <span class="badge">Autonomous Coprocessor</span>
    </header>

    <div id="chat-window">
        <div class="message-bubble bot-message">
            Hey! I'm your Productive Laziness AI. Give me any keyword, character, technical architecture to design, or prompt to narrate.
        </div>
    </div>

    <div class="input-bar">
        <input type="text" id="prompt-input" placeholder="Type a message or single keyword (e.g. iron man, batman, fastapi)..." autocomplete="off">
        <button id="send-btn">Send</button>
    </div>

    <script>
        const input = document.getElementById("prompt-input");
        const sendBtn = document.getElementById("send-btn");
        const chatWindow = document.getElementById("chat-window");

        let conversationHistory = [];

        function appendMessage(content, isUser) {
            const div = document.createElement("div");
            div.className = `message-bubble ${isUser ? 'user-message' : 'bot-message'}`;
            if (isUser) {
                div.textContent = content;
            } else {
                div.innerHTML = marked.parse(content);
            }
            chatWindow.appendChild(div);
            chatWindow.scrollTop = chatWindow.scrollHeight;
            return div;
        }

        async function submitPrompt() {
            const text = input.value.trim();
            if (!text) return;

            appendMessage(text, true);
            input.value = "";

            conversationHistory.push({ role: "user", content: text });
            const loadingBubble = appendMessage("*Processing 360° dossier...*", false);

            try {
                const res = await fetch("/api/chat", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ 
                        prompt: text,
                        history: conversationHistory.slice(-6)
                    })
                });
                const data = await res.json();
                const replyText = data.reply || data.response || data.message || "Done.";
                
                conversationHistory.push({ role: "assistant", content: replyText });
                loadingBubble.innerHTML = marked.parse(replyText);
            } catch (err) {
                loadingBubble.innerHTML = `⚠️ Network error: ${err.message}`;
            }
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        sendBtn.addEventListener("click", submitPrompt);
        input.addEventListener("keydown", (e) => {
            if (e.key === "Enter") submitPrompt();
        });
    </script>
</body>
</html>
