<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Productive Laziness AI - Coprocessor</title>
  <style>
    :root {
      --bg: #0b1120;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --bubble-user: #0284c7;
      --bubble-bot: #1e293b;
      --border: #334155;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      padding: 1rem 2rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    header h1 {
      font-size: 1.25rem;
      color: var(--accent);
    }
    header span {
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    #chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 1.5rem 2rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .msg {
      max-width: 80%;
      padding: 0.9rem 1.2rem;
      border-radius: 10px;
      line-height: 1.5;
      font-size: 0.95rem;
      word-break: break-word;
      white-space: pre-wrap;
    }
    .user {
      align-self: flex-end;
      background-color: var(--bubble-user);
      color: #fff;
    }
    .bot {
      align-self: flex-start;
      background-color: var(--bubble-bot);
      border: 1px solid var(--border);
    }
    .bot audio {
      margin-top: 0.75rem;
      width: 100%;
      display: block;
    }
    #input-bar {
      display: flex;
      padding: 1rem 2rem;
      background-color: #0f172a;
      border-top: 1px solid var(--border);
      gap: 0.75rem;
    }
    #prompt-input {
      flex: 1;
      padding: 0.75rem 1rem;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: #1e293b;
      color: #fff;
      font-size: 1rem;
      outline: none;
    }
    #prompt-input:focus {
      border-color: var(--accent);
    }
    #send-btn {
      padding: 0.75rem 1.5rem;
      border-radius: 6px;
      border: none;
      background-color: var(--accent);
      color: #0b1120;
      font-weight: 600;
      cursor: pointer;
    }
    #send-btn:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <header>
    <h1>Productive Laziness AI</h1>
    <span>Autonomous Coprocessor</span>
  </header>

  <div id="chat-container">
    <div class="msg bot">Hey! I'm your Productive Laziness AI. Give me an idea to design, an audio summary to narrate, or a link to decode.</div>
  </div>

  <div id="input-bar">
    <input type="text" id="prompt-input" placeholder="Type a message or instruction..." />
    <button type="button" id="send-btn" onclick="sendMessage()">Send</button>
  </div>

  <script>
    const chat = document.getElementById('chat-container');
    const input = document.getElementById('prompt-input');

    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        sendMessage();
      }
    });

    async function sendMessage() {
      const text = input.value.trim();
      if (!text) return;

      // 1. Immediately append user bubble
      appendMessage(text, 'user');
      input.value = '';

      // 2. Create placeholder bot bubble
      const botMsg = appendMessage('Thinking...', 'bot');

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt: text })
        });

        if (!res.ok) {
          const errText = await res.text();
          botMsg.innerText = 'Server Error (' + res.status + '): ' + errText;
          return;
        }

        const data = await res.json();
        const content = data.response || 'No response received.';

        // Render response: support innerHTML if audio tags are present, otherwise clean text
        if (content.includes('<audio')) {
          botMsg.innerHTML = content;
        } else {
          botMsg.innerHTML = content;
        }
      } catch (err) {
        botMsg.innerText = 'Network error: ' + err.message;
      }

      chat.scrollTop = chat.scrollHeight;
    }

    function appendMessage(text, sender) {
      const bubble = document.createElement('div');
      bubble.className = 'msg ' + sender;
      bubble.innerText = text;
      chat.appendChild(bubble);
      chat.scrollTop = chat.scrollHeight;
      return bubble;
    }
  </script>
</body>
</html>
